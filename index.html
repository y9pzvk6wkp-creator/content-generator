<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ContentAI — Générateur Instagram & TikTok</title>
<style>
  /* ═══════════════════════════════════════════
     VARIABLES & RESET
     ═══════════════════════════════════════════ */
  :root {
    --bg-primary: #0f0f1a;
    --bg-card: #1a1a2e;
    --bg-input: #0f0f1a;
    --border-subtle: #2d2d4e;
    --border-input: #3d3d5e;
    --text-primary: #ffffff;
    --text-secondary: #a0a0c0;
    --text-muted: #6b7280;
    --accent-indigo: #6366f1;
    --accent-violet: #8b5cf6;
    --accent-pink: #ec4899;
    --accent-green: #10b981;
    --accent-amber: #f59e0b;
    --accent-red: #dc2626;
    --accent-blue: #60a5fa;
    --gradient-primary: linear-gradient(135deg, var(--accent-indigo), var(--accent-violet));
    --gradient-header: linear-gradient(135deg, var(--accent-indigo), var(--accent-violet), var(--accent-pink));
    --gradient-secondary: linear-gradient(135deg, var(--accent-pink), #f43f5e);
    --gradient-stripe: linear-gradient(135deg, #635bff, #4f46e5);
    --radius-sm: 8px;
    --radius-md: 10px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --radius-2xl: 20px;
    --shadow-lg: 0 10px 40px rgba(0,0,0,0.3);
    --transition-fast: 0.2s ease;
    --transition-normal: 0.3s ease;
    --max-width: 800px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* Scrollbar personnalisée */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-input); }

  /* ═══════════════════════════════════════════
     HEADER
     ═══════════════════════════════════════════ */
  .header {
    background: var(--gradient-header);
    padding: 24px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
  }
  .header::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 60%);
    animation: headerShine 8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes headerShine {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(20%, 20%); }
  }
  .header h1 { font-size: 1.8em; font-weight: 800; position: relative; z-index: 1; }
  .header p { opacity: 0.9; margin-top: 6px; font-size: 0.9em; position: relative; z-index: 1; }

  /* ═══════════════════════════════════════════
     LAYOUT
     ═══════════════════════════════════════════ */
  .container { max-width: var(--max-width); margin: 0 auto; padding: 20px; }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl);
    padding: 24px;
    margin-bottom: 20px;
    transition: border-color var(--transition-normal);
    animation: fadeInUp 0.4s ease forwards;
  }
  .card:hover { border-color: rgba(99, 102, 241, 0.3); }

  .card-title {
    font-size: 1.05em;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ═══════════════════════════════════════════
     FORMS
     ═══════════════════════════════════════════ */
  label {
    display: block;
    font-size: 0.85em;
    color: var(--text-secondary);
    margin-bottom: 6px;
    margin-top: 14px;
    font-weight: 500;
  }

  select, textarea {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border-input);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    color: var(--text-primary);
    font-size: 0.95em;
    outline: none;
    font-family: inherit;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  }
  select:focus, textarea:focus {
    border-color: var(--accent-indigo);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }
  select { cursor: pointer; }
  textarea { resize: vertical; min-height: 80px; }

  .textarea-wrap { position: relative; }
  .char-count {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-size: 0.7em;
    color: var(--text-muted);
    pointer-events: none;
  }

  /* ═══════════════════════════════════════════
     BUTTONS
     ═══════════════════════════════════════════ */
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius-lg);
    font-size: 1em;
    font-weight: 700;
    cursor: pointer;
    margin-top: 16px;
    transition: all var(--transition-fast);
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
