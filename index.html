<!DOCTYPE html> <html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>ContentAI — Générateur Instagram & TikTok</title> <style> /* Style moderne et épuré */ * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f111a; color: #fff; min-height: 100vh; padding-bottom: 50px; } .header { background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899); padding: 30px 20px; text-align: center; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); } .header h1 { font-size: 2em; font-weight: 800; letter-spacing: -1px; } .header p { opacity: 0.9; margin-top: 5px; font-size: 1rem; } .container { max-width: 800px; margin: 0 auto; padding: 0 20px; } .card { background: #1a1c2e; border: 1px solid #2d2f4e; border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); } label { display: block; font-size: 0.85em; color: #a0a0c0; margin-bottom: 8px; margin-top: 15px; font-weight: 600; } select, textarea { width: 100%; background: #0f111a; border: 1px solid #3d3d5e; border-radius: 12px; padding: 14px; color: #fff; font-size: 1rem; outline: none; transition: border 0.3s; } select:focus, textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); } textarea { resize: vertical; min-height: 100px; } .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 1em; font-weight: 700; cursor: pointer; margin-top: 20px; transition: all 0.2s; color: #fff; } .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); } .btn-primary:hover { transform: translateY(-2px); opacity: 0.9; } .btn-secondary { background: linear-gradient(135deg, #ec4899, #f43f5e); } .btn-stripe { background: #635bff; font-size: 1.1em; } .btn-danger { background: transparent; border: 1px solid #dc2626; color: #f87171; padding: 8px 15px; width: auto; margin-top: 0; font-size: 0.8em; } .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; } .tabs { display: flex; gap: 10px; margin-bottom: 25px; background: #1a1c2e; padding: 8px; border-radius: 16px; } .tab { flex: 1; padding: 12px; text-align: center; border-radius: 10px; cursor: pointer; font-size: 0.9em; transition: 0.3s; color: #a0a0c0; } .tab.active { background: #6366f1; color: #fff; font-weight: 600; } .section { display: none; } .section.active { display: block; } .result-box { background: #0b0c16; border: 1px solid #3d3d5e; border-radius: 12px; padding: 20px; margin-top: 20px; white-space: pre-wrap; line-height: 1.6; display: none; color: #e0e0ff; } .result-box.show { display: block; } .copy-btn { background: #2d2d4e; border: none; color: #fff; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 0.85em; margin-top: 10px; } .spinner { display: none; text-align: center; padding: 20px; color: #8b5cf6; font-weight: 600; } .spinner.show { display: block; } .platform-tags { display: flex; gap: 10px; flex-wrap: wrap; } .tag { padding: 8px 20px; border-radius: 25px; border: 1px solid #3d3d5e; font-size: 0.85em; cursor: pointer; transition: 0.2s; } .tag.selected { background: #6366f1; border-color: #6366f1; color: white; } .status-bar { background: #1a1c2e; border: 1px solid #2d2f4e; border-radius: 16px; padding: 15px 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; } .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #10b981; margin-right: 10px; } #paywall { display: none; } .price-box { background: #1e1e3a; border: 2px solid #6366f1; border-radius: 20px; padding: 30px; text-align: center; } .price-amount { font-size: 2.5em; font-weight: 800; color: #fff; margin: 10px 0; } </style> </head> <body> <div class="header"> <h1>⚡ ContentAI</h1> <p>Générateur de contenu IA — Viral et Rapide</p> </div> <div class="container"> <!-- BARRE DE STATUT --> <div class="status-bar" id="status-bar"> <div style="display:flex; align-items:center;"> <div class="status-dot"></div> <span id="status-text" style="font-size:0.9em;">Session active</span> </div> <span id="plan-badge" style="background:#312e81; padding:4px 10px; border-radius:20px; font-size:0.7em; font-weight:bold;">TRIAL</span> </div> <!-- ONGLETS --> <div class="tabs"> <div class="tab active" onclick="switchTab('text')">✍️ Textes </div> <div class="tab" onclick="switchTab('video')">🎬 Vidéos</div> <div class="tab" onclick="switchTab('strategy')">📊 Stratégie</div> </div> <!-- SECTION TEXTES --> <div id="text-section" class="section active"> <div class="card"> <label>Plateforme</label> <div class="platform-tags"> <div class="tag selected" onclick="this.classList.toggle('selected')">Instagram</div> <div class="tag" onclick="this.classList.toggle('selected')">TikTok</div> </div> <label>Niche</label> <select id="niche"> <option>Lifestyle</option><option>Business</option><option>Fitness</option><option>Tech / IA</option> </select> <label>Ton sujet</label> <textarea id="topic" placeholder="Décris ton idée de post..."></textarea> <button class="btn btn-primary" onclick="generateText()">⚡ Générer le contenu</button> <div class="spinner" id="ts">🤖 Intelligence Artificielle en action...</div> <div class="result-box" id="tr"></div> <button class="copy-btn" id="tc" style="display:none" onclick="copyResult('tr')">📋 Copier le texte</button> </div> </div> <!-- SECTION VIDEOS --> <div id="video-section" class="section"> <div class="card"> <label>Sujet de la vidéo</label> <textarea id="vdesc" placeholder="Ex: Un paysage futuriste avec des néons..."></textarea> <button class="btn btn-secondary" onclick="generateVideo()">🎬 Créer le prompt vidéo</button> <div class="spinner" id="vs">🎬 Création du prompt...</div> <div class="result-box" id="vpr"></div> <button class="copy-btn" id="vpc" style="display:none" onclick="copyResult('vpr')">📋 Copier le prompt</button> </div> </div> <!-- SECTION STRATEGIE --> <div id="strategy-section" class="section"> <div class="card"> <label>Ta niche</label> <select id="sn"> <option>Lifestyle</option><option>Business</option><option>Voyage</option> </select> <button class="btn btn-primary" onclick="generateStrategy()">📊 Créer ma stratégie</button> <div class="spinner" id="ss">📊 Analyse stratégique...</div> <div class="result-box" id="sr"></div> <button class="copy-btn" id="sc" style="display:none" onclick="copyResult('sr')">📋 Copier la stratégie</button> </div> </div> </div> <script> // On reprend la logique simplifiée de ton premier code const API_URL = ''; // Laisse vide si ton backend est sur le même domaine async function generate(prompt) { try { const response = await fetch(API_URL + '/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) }); const data = await response.json(); return data.text || data; } catch (err) { console.error(err); // Pour que ça fonctionne sur GitHub Pages même sans backend (pour test) return "Désolé, la connexion au serveur IA a échoué. (Vérifie que ton backend est bien en ligne)"; } } async function generateText() { const topic = document.getElementById('topic').value; if(!topic) return alert("Indique un sujet !"); showLoading('ts', 'tr', 'tc'); const res = await generate(`Génère un post viral pour ${topic}`); hideLoading('ts', 'tr', 'tc', res); } async function generateVideo() { const desc = document.getElementById('vdesc').value; if(!desc) return alert("Décris la vidéo !"); showLoading('vs', 'vpr', 'vpc'); const res = await generate(`Génère un prompt RunwayML pour : ${desc}`); hideLoading('vs', 'vpr', 'vpc', res); } async function generateStrategy() { showLoading('ss', 'sr', 'sc'); const res = await generate(`Crée une stratégie de contenu de 30 jours pour la niche ${document.getElementById('sn').value}`); hideLoading('ss', 'sr', 'sc', res); } // Fonctions UI simples function switchTab(tab) { document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); event.currentTarget.classList.add('active'); document.getElementById(tab + '-section').classList.add('active'); } function showLoading(spin, res, btn) { document.getElementById(spin).classList.add('show'); document.getElementById(res).classList.remove('show'); document.getElementById(btn).style.display = 'none'; } function hideLoading(spin, res, btn, text) { document.getElementById(spin).classList.remove('show'); const resBox = document.getElementById(res); resBox.textContent = text; resBox.classList.add('show'); document.getElementById(btn).style.display = 'inline-block'; } function copyResult(id) { const text = document.getElementById(id).textContent; navigator.clipboard.writeText(text).then(() => alert("Copié !")); } </script> </body> </html>
